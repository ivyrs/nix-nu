[widget.active_window]
display = "text_only"
max_length = 500
min_length = 0

[widget.battery]
hide_when_full = true

[widget.cat]
audio_spectrum = true
scale = 1.1000000000000001
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.media]
hide_when_no_media = true
max_length = 500

[widget.network]
show_label = false
show_vpn_label = true
vpn_status = "both"

[widget.notifications]
hide_when_no_unread = true

[widget.tray]
drawer = true

[widget.workspaces]
hide_when_empty = true
show_labels = false
