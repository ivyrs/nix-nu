# Generated noctalia theme for ncspot
use_nerdfont = true

[theme]
background = "{{colors.background.default.hex}}"
primary = "{{colors.on_background.default.hex}}"
secondary = "{{colors.outline.default.hex}}"
title = "{{colors.primary.default.hex}}"

highlight = "{{colors.on_primary.default.hex}}"
highlight_bg = "{{colors.primary.default.hex}}"
highlight_inactive_bg = "{{colors.surface_variant.default.hex}}"

playing = "{{colors.tertiary.default.hex}}"
playing_selected = "{{colors.on_tertiary_container.default.hex}}"
playing_bg = "{{colors.background.default.hex}}"

error = "{{colors.on_error_container.default.hex}}"
error_bg = "{{colors.error_container.default.hex}}"

statusbar = "{{colors.on_primary.default.hex}}"
statusbar_bg = "{{colors.primary.default.hex}}"
statusbar_progress = "{{colors.primary.default.hex}}"
statusbar_progress_bg = "{{colors.surface_variant.default.hex}}"

cmdline = "{{colors.on_surface.default.hex}}"
cmdline_bg = "{{colors.surface_variant.default.hex}}"

search_match = "{{colors.tertiary.default.hex}}"
