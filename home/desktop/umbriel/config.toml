# Umbriel config, ported from home/desktop/niri/*.kdl.
# Check with: umbriel config validate
#
# Colours come from Noctalia's Umbriel template (Settings → Templates →
# Compositors → Umbriel), which writes ~/.config/umbriel/noctalia.toml.
# This file is a read-only store symlink, so Noctalia can't add the include
# itself; it's declared here instead.

[include.optional]
files = ["@home@/.config/umbriel/noctalia.toml"]

[general]
mod_key = "Super"
# Noctalia is started by its systemd user service (programs.noctalia.systemd),
# so it is not in autostart. niri-pip-follow isn't needed: the PiP rule below
# pins the window, which keeps it visible across workspaces.
autostart = []

# ── displays ─────────────────────────────────────────────────────────────
[output.eDP-1]
mode = "2880x1800@60"
scale = 1.5
transform = "normal"
position = [0, 0]

# ── input ────────────────────────────────────────────────────────────────
[input.keyboard]
layout = "gb,us"
variant = "mac,"
options = "caps:escape"
numlock_toggle = true

[input.touchpad]
disable_while_typing = true

[input.mouse]
sensitivity = 0.5

# ── layout ───────────────────────────────────────────────────────────────
[layout]
mode = "master"
gap = 16
extent_presets = [0.33333, 0.5, 0.66667]

[layout.scrolling]
default_extent_fraction = 0.5
center_focused = "never"

# ── appearance ───────────────────────────────────────────────────────────
[appearance]
prefer_no_csd = true
border_width = 2
corner_radius = 0

[appearance.title_bar]
mode = "off"

[appearance.shadow]
enabled = false
softness = 30
offset_x = 0
offset_y = 5

# Fallback colours if the Noctalia template isn't enabled yet
# (same values as the niri focus ring).
[colors.border]
focused = "#7fc8ffff"
unfocused = "#505050ff"

[colors]
shadow = "#00000077"

# ── scratchpads (replace scratch-toggle + focus-or-spawn) ────────────────
[[scratchpad]]
name = "scratch"

[[scratchpad]]
name = "files"
spawn_when_empty = "ghostty --gtk-single-instance=false --class=rs.ivy.yazi -e yazi"

[[scratchpad]]
name = "ts"
spawn_when_empty = "ghostty --gtk-single-instance=false --class=rs.ivy.tui -e lazytailscale"

# ── window rules ─────────────────────────────────────────────────────────
[[window_rule]]
match.app_id = "^rs[.]ivy[.]launcher$"
default_floating = true
default_floating_size_px = { width = 500, height = 600 }

[[window_rule]]
match.app_id = "^rs[.]ivy[.]tui$"
default_floating = true
default_floating_size_px = { width = 1000, height = 650 }

[[window_rule]]
match.app_id = "^rs[.]ivy[.]yazi$"
default_scratchpad = "files"
default_floating_size = { width = 0.7, height = 0.7 }

[[window_rule]]
match.app_id = "firefox$"
match.title = "^Picture-in-Picture$"
default_floating = true
default_pinned = true
default_floating_size_px = { width = 480, height = 270 }
default_position = { x = 16, y = 16, anchor = "top_right" }

[[window_rule]]
match.app_id = "^pinentry"
default_floating = true

[[window_rule]]
match.app_id = "^md[.]Obsidian$"
default_focused = true

[[window_rule]]
match.app_id = "^dev[.]noctalia[.]Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

# ── layer rules ──────────────────────────────────────────────────────────
# Noctalia's recommended blur for its own surfaces.
[[layer_rule]]
match.namespace = '^noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd)$'
blur = true
blur_ignore_alpha = 0.6
blur_optimized = false

# ── keybinds ─────────────────────────────────────────────────────────────
# Key names follow xkb keysyms (slash, grave, comma…). If validate rejects
# one, check `umbriel config validate` output for the expected spelling.
[keybinds]
"Mod+Shift+slash" = "cheatsheet-toggle"

# apps
"Mod+Return" = "spawn:ghostty"
"Mod+E" = "scratchpad-toggle:files"
"Mod+O" = "spawn:obsidian"
"Mod+T" = "scratchpad-toggle:ts"

# command bar / app search
"Mod+slash" = "spawn:ghostty --gtk-single-instance=false --class=rs.ivy.launcher -e otter-launcher"
"Mod+D" = "spawn:ghostty --gtk-single-instance=false --class=rs.ivy.launcher -e fsel -d -r"

# scratch
"Mod+grave" = "scratchpad-toggle:scratch"
"Mod+Shift+grave" = "window-toggle-scratchpad:scratch"

# Noctalia
"Super+Alt+L" = "spawn:noctalia msg session lock"
"Mod+N" = "spawn:noctalia msg panel-toggle control-center"
"Mod+Tab" = "spawn:noctalia msg window-switcher"
"Alt+Tab" = "spawn:noctalia msg window-switcher hold"
"Mod+Shift+N" = "spawn:noctalia msg notification-dnd-toggle"
"Mod+Shift+W" = "spawn:noctalia msg wallpaper-random"
"Mod+Shift+T" = "spawn:noctalia msg theme-mode-toggle"
"Mod+Shift+E" = "spawn:noctalia msg panel-toggle session"

# screenshots
"Print" = "spawn:noctalia msg screenshot-region"
"Shift+Print" = "spawn:noctalia msg screenshot-fullscreen"
"Ctrl+Print" = "spawn:noctalia msg screenshot-fullscreen"
"Alt+Print" = "spawn:noctalia msg screenshot-window"
"Mod+Shift+S" = "spawn:noctalia msg screenshot-region"
"Mod+Shift+1" = "spawn:noctalia msg screenshot-region"

# media
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }

# volume / brightness
"XF86AudioRaiseVolume" = { action = "spawn:wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", allow_when_locked = true, repeat = false }
"XF86MonBrightnessUp" = { action = "spawn:brightnessctl set 5%+", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:brightnessctl set 5%-", allow_when_locked = true }
"XF86KbdBrightnessUp" = { action = "spawn:noctalia msg keyboard-backlight-up", allow_when_locked = true }
"XF86KbdBrightnessDown" = { action = "spawn:noctalia msg keyboard-backlight-down", allow_when_locked = true }

# overview / close
"Mod+Space" = { action = "overview-toggle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }

# focus
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"

# move
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+J" = "window-move-down"
"Mod+Ctrl+K" = "window-move-up"
"Mod+Ctrl+L" = "column-move-right"

"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

# monitors
"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+H" = "output-focus-left"
"Mod+Shift+J" = "output-focus-down"
"Mod+Shift+K" = "output-focus-up"
"Mod+Shift+L" = "output-focus-right"

"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+H" = "column-move-to-output-left"
"Mod+Shift+Ctrl+J" = "column-move-to-output-down"
"Mod+Shift+Ctrl+K" = "column-move-to-output-up"
"Mod+Shift+Ctrl+L" = "column-move-to-output-right"

# workspaces
"Mod+U" = "workspace-next"
"Mod+I" = "workspace-previous"
"Mod+Ctrl+U" = "column-move-to-workspace-next"
"Mod+Ctrl+I" = "column-move-to-workspace-previous"
"Mod+Shift+U" = "workspace-move-down"
"Mod+Shift+I" = "workspace-move-up"

"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Ctrl+WheelLeft" = "column-move-left"

"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Ctrl+1" = "column-move-to-workspace:1"
"Mod+Ctrl+2" = "column-move-to-workspace:2"
"Mod+Ctrl+3" = "column-move-to-workspace:3"
"Mod+Ctrl+4" = "column-move-to-workspace:4"
"Mod+Ctrl+5" = "column-move-to-workspace:5"
"Mod+Ctrl+6" = "column-move-to-workspace:6"
"Mod+Ctrl+7" = "column-move-to-workspace:7"
"Mod+Ctrl+8" = "column-move-to-workspace:8"
"Mod+Ctrl+9" = "column-move-to-workspace:9"

# columns
"Mod+bracketleft" = "window-consume-or-expel-left"
"Mod+bracketright" = "window-consume-or-expel-right"

# sizing
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+minus" = "window-modify-primary-extent:-0.1"
"Mod+equal" = "window-modify-primary-extent:0.1"
"Mod+Shift+minus" = "window-modify-height-down:0.1"
"Mod+Shift+equal" = "window-modify-height-up:0.1"

"Mod+F" = "window-toggle-maximize"
"Mod+Shift+F" = "window-toggle-fullscreen"
"Mod+M" = "window-toggle-maximize-to-edges"
"Mod+C" = "column-center"

# floating / tabs
"Mod+V" = "window-toggle-floating"
"Mod+Shift+V" = "window-focus-switch-floating"
"Mod+W" = "column-toggle-tabbed"

# system
"Mod+Escape" = "shortcuts-inhibit-toggle"
"Mod+Shift+P" = "dpms-off"
